services:
  app:
    image: fiap-soat11:v2
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=fiap;Uid=user_fiap;Pwd=pass_fiap;
    depends_on:
      - db
    networks:
      - app-network
  db:
    image: amazon/dynamodb-local:latest
    restart: always
    ports:
      - "8000:8000"    
    networks:
      - app-network

networks:
  app-network:
    driver: bridge